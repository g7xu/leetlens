[project]
name = "leetlens-mcp"
version = "0.1.0"
description = "MCP server exposing LeetLens practice-session data for LLM analysis"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.2.0", "httpx>=0.27"]

[project.scripts]
leetlens-mcp = "leetlens_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leetlens_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
