name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Extension unit tests
        # Deliberately against extension/src, not dist/ — tests must never
        # need a build to run.
        run: node --test 'test/*.test.mjs'

      - name: Build the extension
        run: npm run build

      - name: No module syntax in the classic content scripts
        # main-world.js and content.js are loaded as classic scripts, so a
        # surviving import/export is a runtime error Chrome reports only in
        # the page console. Parsing them as CommonJS rejects both.
        run: |
          cp dist/main-world.js /tmp/main-world.cjs
          cp dist/content.js /tmp/content.cjs
          node --check /tmp/main-world.cjs
          node --check /tmp/content.cjs
          node -e "
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
          const refs = [m.background.service_worker, ...m.content_scripts.flatMap(c => c.js), m.options_page];
          const missing = refs.filter((r) => !fs.existsSync('dist/' + r));
          if (missing.length) throw new Error('manifest references missing files: ' + missing);
          console.log('manifest references all resolve');
          "

      - name: Validate the embedded data-repo templates
        # The files users receive live as template literals in repo-setup.js —
        # a typo there is invisible until it lands in someone's data repo.
        # test/repo-setup.test.mjs checks the JSON ones; YAML needs a parser
        # this repo does not ship, so the workflow is checked here.
        run: |
          node -e "import('./extension/src/lib/repo-setup.js').then(m => process.stdout.write(m.WORKFLOW_YML))" > /tmp/embedded-publish.yml
          python3 -m pip install --quiet pyyaml
          python3 -c "
          import yaml
          d = yaml.safe_load(open('/tmp/embedded-publish.yml'))
          steps = d['jobs']['build-and-deploy']['steps']
          assert len(steps) >= 5, 'workflow lost its steps'
          print(f'embedded workflow OK: {len(steps)} steps')
          "

      - name: MCP server compiles
        run: python3 -m compileall -q mcp/src

      - uses: astral-sh/setup-uv@v5

      - name: MCP server tests
        run: uv run --directory mcp --group dev pytest -q
