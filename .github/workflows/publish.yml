name: publish

on:
  push:
    branches: [main]
    # The index-commit below only touches data/index.json; ignoring it here is
    # a second layer of loop protection (GITHUB_TOKEN pushes don't retrigger
    # workflows anyway).
    paths-ignore: ['data/index.json']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Rebuild data/index.json
        run: uv run --directory mcp python -m leetlens_mcp.indexer

      - name: Commit index if changed
        run: |
          # -I ignores timestamp-only diffs so no-op runs don't create commits
          if ! git diff -I'"generated_at"' --quiet data/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/index.json
            git commit -m "chore: rebuild data/index.json"
            # The extension pushes a solution commit right after the session
            # commit that triggered this run, so main often moves while we
            # build. Rebase over whatever landed and retry; a racing commit
            # with new session data retriggers the workflow anyway.
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase origin main || exit 1
            done
          fi

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/data
          cp -r dashboard/* _site/
          cp data/index.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
